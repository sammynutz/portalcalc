      <text x="272" y="196" fill="#34506d" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="1.6">STRUCTURAL SOFTWARE</text>
      <path d="M270 214h500" stroke="#39c98c" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="36" y="358" fill="#34506d" font-family="Segoe UI, Arial, sans-serif" font-size="21">Strong small-size monogram; simpler, more app-icon friendly.</text>
