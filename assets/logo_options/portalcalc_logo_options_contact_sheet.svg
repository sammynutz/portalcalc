    <text x="36" y="358" fill="#34506d" font-family="Segoe UI, Arial, sans-serif" font-size="21">Closest to the current direction, but SLS is more embedded.</text>
  </g>

  <g transform="translate(70 690)">
    <rect width="820" height="420" rx="16" fill="#ffffff"/>
    <text x="34" y="48" fill="#10243a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="750">C. Blueprint badge</text>
