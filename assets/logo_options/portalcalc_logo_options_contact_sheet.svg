<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1240" role="img" aria-labelledby="title desc">
  <title id="title">Portal Calc logo options</title>
  <desc id="desc">Four alternative Portal Calc logos with stronger SLS incorporation.</desc>
  <rect width="1920" height="1240" fill="#eef3f7"/>
  <text x="70" y="86" fill="#10243a" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="750">Portal Calc logo options</text>
  <text x="70" y="126" fill="#34506d" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">SLS-forward directions, all vector-editable</text>

  <g transform="translate(70 170)">
    <rect width="820" height="420" rx="16" fill="#ffffff"/>
    <text x="34" y="48" fill="#10243a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="750">A. SLS wordmark lead</text>
    <g transform="translate(32 92) scale(0.82)">
      <rect width="920" height="260" rx="18" fill="#ffffff"/>
      <g transform="translate(42 42)">
        <path d="M24 174V78L88 32l64 46v96" fill="none" stroke="#10243a" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 174h128" fill="none" stroke="#39c98c" stroke-width="15" stroke-linecap="round"/>
        <path d="M60 148l64-64" fill="none" stroke="#39c98c" stroke-width="11" stroke-linecap="round"/>
        <text x="46" y="126" fill="#10243a" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800">SLS</text>
      </g>
      <text x="236" y="113" fill="#10243a" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="800">SLS</text>
      <text x="380" y="113" fill="#10243a" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="650">Portal Calc</text>
