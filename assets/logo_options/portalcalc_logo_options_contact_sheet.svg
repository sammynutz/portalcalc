        <path d="M24 48h148M24 98h148M24 148h148M48 24v148M98 24v148M148 24v148" stroke="#24415e" stroke-width="2"/>
        <path d="M36 154V76L98 34l62 42v78" fill="none" stroke="#f7fbff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
