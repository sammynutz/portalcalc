        <path d="M38 150V76l60-40 60 40v74" fill="none" stroke="#f7fbff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M38 150h120" fill="none" stroke="#39c98c" stroke-width="13" stroke-linecap="round"/>
        <path d="M70 130c0 14 13 24 31 24 19 0 33-10 33-24 0-13-12-19-34-24-19-5-28-12-28-25 0-15 13-25 31-25 15 0 27 7 33 18" fill="none" stroke="#f7fbff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M68 110h70" fill="none" stroke="#f7fbff" stroke-width="9" stroke-linecap="round"/>
        <path d="M74 142l58-76" fill="none" stroke="#39c98c" stroke-width="9" stroke-linecap="round"/>
