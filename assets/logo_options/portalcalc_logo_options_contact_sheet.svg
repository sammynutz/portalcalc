    </g>
    <text x="36" y="358" fill="#34506d" font-family="Segoe UI, Arial, sans-serif" font-size="21">More technical and precise; good for engineering credibility.</text>
  </g>

  <g transform="translate(1030 690)">
    <rect width="820" height="420" rx="16" fill="#ffffff"/>
    <text x="34" y="48" fill="#10243a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="750">D. Compact monogram</text>
    <g transform="translate(32 92) scale(0.82)">
      <rect width="920" height="260" rx="18" fill="#ffffff"/>
      <g transform="translate(46 38)">
        <circle cx="92" cy="92" r="92" fill="#10243a"/>
        <path d="M37 139V74L92 39l55 35v65" fill="none" stroke="#f7fbff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M37 139h110" fill="none" stroke="#39c98c" stroke-width="11" stroke-linecap="round"/>
